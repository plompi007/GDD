name: Android debug build (M3.5)

# M3.5 (docs/GDD.md §3.5/§7.6): the dev sandbox this project is built in
# cannot reach dl.google.com (org network policy), so it cannot fetch the
# Android NDK and cross-compile/link locally. GitHub Actions runners have
# normal internet access, so this workflow does the actual APK build.
#
# This is a *debug* smoke-test build only, self-signed by cargo-apk's
# built-in debug keystore, for installing via `adb install` on a personal
# device to confirm the app boots at all on real Android. Release
# signing/Play Store upload is M7/M10/M11 work, not this workflow.

on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
    paths:
      - "src/**"
      - "data/**"
      - "levels/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    # A full from-scratch cross-compile of Bevy + bevy_rapier2d (text
    # shaping, audio, gltf, etc. all come along) took 26+ minutes on a
    # cold cache the first time this actually ran — give it real headroom
    # instead of silently timing out mid-build.
    timeout-minutes: 60
    env:
      # A debug build's full-fidelity DWARF across that entire dependency
      # tree is what blew the runner's disk ("No space left on device")
      # after a 26-minute build otherwise succeeded — this is still a
      # debug (unoptimized, cargo-apk-default-signed) build, just without
      # carrying full debug symbols nothing here uses anyway.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      # Standard free-disk-space step for large Android builds: ubuntu-latest
      # ships ~25GB of preinstalled toolchains (dotnet, ghc, boost, unused
      # Android system images) this workflow never touches.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v3

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Install Android NDK + platform
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          # cargo-apk needs an SDK platform (android.jar, aapt) to build
          # against regardless of Cargo.toml's own target_sdk_version —
          # "platforms;android-30" is what it looks for by default.
          sdkmanager --install "platforms;android-30"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: cargo apk build

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chainworks-debug-apk
          path: target/debug/apk/*.apk
          if-no-files-found: error
