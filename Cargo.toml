[package]
name = "chainworks"
version = "0.0.1"
edition = "2021"
description = "ChainWorks — an original chain-reaction physics puzzle game."
license = "UNLICENSED"

[[bin]]
name = "chainworks"
path = "src/main.rs"

# "cdylib" is what Android actually loads (as libchainworks.so, via JNI from
# the thin Java Activity cargo-apk generates); "rlib" keeps it usable as a
# normal library on desktop (src/main.rs, tests/*.rs). See src/app.rs for
# the #[bevy_main] entry point this requires.
[lib]
name = "chainworks"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# M3.5 (docs/GDD.md §7.5): built via `cargo apk build` — see
# .github/workflows/android.yml, since this sandboxed dev environment
# cannot reach dl.google.com to fetch the NDK itself (org network policy,
# not something to retry) and so cannot cross-compile/link for Android
# locally. GitHub Actions runners have normal internet access and build
# the real APK. `package` is a placeholder — MUST change to your own
# reverse-DNS before any real store submission (docs/GDD.md §7.2/§7.5:
# this can never change post-publish).
[package.metadata.android]
package = "com.chainworksgame.app"
apk_label = "ChainWorks"
target_sdk_version = 34
min_sdk_version = 26

[dependencies]
# Bevy (v1.3 pivot — see docs/GDD.md §2.1a): unlike `nannou`, Bevy natively
# targets Android/iOS/desktop/web from one codebase, MIT/Apache-2.0 licensed
# (no GPL entanglement), and still mirrors OpenTIM's module shape (parts as
# data + systems, a level-loading layer) via its ECS instead of a monolithic
# Model struct.
#
# Pinned to 0.16 (not the latest 0.19.x): bevy_reflect 0.19.x unconditionally
# requires glam >=0.32, and glam 0.32.1's Serialize/Deserialize impls for
# BVec3A/BVec4A are written against `serde_core` in a way this serde release
# doesn't satisfy — a hard compile error with no workaround via our own
# feature flags (verified: reproduces with bevy_rapier2d defaults trimmed
# too). bevy_reflect 0.16.x depends on glam 0.29.3, well below the broken
# line. Revisit this pin once the glam/serde_core split stabilizes upstream.
bevy = "0.16"
# "enhanced-determinism" trades a little performance for identical results
# across platforms/architectures — required by docs/GDD.md §2.6 (golden
# replay tests must reproduce a solved level bit-for-bit). This forwards to
# rapier2d's own `enhanced-determinism` feature. Version matched to bevy 0.16.
bevy_rapier2d = { version = "0.30", default-features = false, features = ["dim2", "enhanced-determinism"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
